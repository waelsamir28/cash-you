name: Package CASH YOU for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run build

      - name: Package NSIS installer
        run: |
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); p.version='1.4.2'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n');"
          npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CASH-YOU-Windows-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./package.json').version || '1.4.2'")
          TAG="desktop-v${APP_VERSION}"
          FILES=()
          while IFS= read -r -d '' f; do FILES+=("$f"); done < <(find dist release -maxdepth 2 -type f \( -name '*.exe' -o -name '*.blockmap' \) -print0 2>/dev/null)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "CASH YOU Desktop v${APP_VERSION}" --notes "CASH-YOU-Setup-${APP_VERSION}.exe" "${FILES[@]}"
          fi
