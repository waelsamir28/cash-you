name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    env:
      # The build only needs a syntactically valid URL; CI does not connect to a database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/cash_you?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check Electron and service-worker syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/db-config.cjs
          node --check electron/local-server.cjs
          node --check electron/local-db.cjs
          node --check public/cash-you-sw.js
          node --check tools/test-asar-paths.cjs
          node --check tools/test-packaged-postgres.cjs
          node --check tools/check-desktop-bundle.cjs
          node --input-type=commonjs -e "const fs=require('node:fs');const vm=require('node:vm');const html=fs.readFileSync('tools/activation-generator.html','utf8');const script=html.match(/<script>([\\s\\S]*?)<\/script>/);if(!script)throw new Error('activation generator script not found');new vm.Script(script[1]);"

      - name: Build Next.js app
        run: npm run build

      - name: Smoke test the bundled PostgreSQL
        run: npm run test:embedded

      # انحدار الإصدار 1.3.0: الثنائيات داخل app.asar غير قابلة للتنفيذ.
      - name: Start PostgreSQL from inside the packaged app.asar layout
        run: npm run test:asar

      - name: Verify the desktop bundle (asarUnpack + runtime dependencies)
        run: npm run test:desktop-bundle
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/cash_you?sslmode=disable
