<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>مولّد التفعيل - CASH YOU</title>
  <style>
    /* ===== هوية الأداة ===== */
    :root{
      --navy-1:#07152e;
      --navy-2:#0b2a5b;
      --navy-3:#123f85;
      --blue:#1d4ed8;
      --blue-dark:#1e40af;
      --green-bg:#ecfdf3;
      --green-border:#22c55e;
      --green-deep:#15803d;
      --ink:#0f172a;
      --muted:#64748b;
      --radius:18px;
      font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",Arial,sans-serif;
      font-synthesis:none;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 16px;
      background:linear-gradient(135deg,#06122b 0%,#0a2550 45%,#133f86 100%);
      background-attachment:fixed;
      color:var(--ink);
    }

    /* توهج خفيف في الخلفية */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 15% 12%,#3b82f62e 0,transparent 42%),
        radial-gradient(circle at 88% 90%,#0ea5e91f 0,transparent 40%);
    }

    .card{
      position:relative;
      width:100%;
      max-width:420px;
      background:#ffffff;
      border-radius:var(--radius);
      box-shadow:0 24px 60px rgba(2,10,30,.45),0 2px 8px rgba(2,10,30,.18);
      padding:30px 26px 26px;
      overflow:hidden;
    }

    /* شريط علوي أزرق رفيع */
    .card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:5px;
      background:linear-gradient(90deg,#1d4ed8,#38bdf8,#1d4ed8);
    }

    .brand{text-align:center;margin-bottom:22px}
    .brand h1{
      margin:0;
      font-size:21px;
      line-height:1.5;
      font-weight:800;
      color:var(--blue);
      letter-spacing:-.2px;
    }
    .brand p{
      margin:7px 0 0;
      font-size:13px;
      line-height:1.8;
      color:var(--muted);
    }

    .field{margin-bottom:16px}
    .field label{
      display:block;
      margin-bottom:8px;
      font-size:13.5px;
      font-weight:700;
      color:#334155;
    }

    #machineId{
      width:100%;
      height:48px;
      padding:0 14px;
      border-radius:12px;
      border:1.5px solid #d7dee9;
      background:#f8fafc;
      color:var(--ink);
      font:600 15px/1 "Consolas","Courier New",monospace;
      text-align:center;
      direction:ltr;
      text-transform:uppercase;
      letter-spacing:.6px;
      outline:none;
      transition:border-color .18s,box-shadow .18s,background .18s;
    }
    #machineId::placeholder{color:#94a3b8;font-weight:500;letter-spacing:.4px;text-transform:none}
    #machineId:hover{border-color:#b8c4d6}
    #machineId:focus{
      border-color:var(--blue);
      background:#fff;
      box-shadow:0 0 0 4px #1d4ed81f;
    }

    .error{
      display:none;
      margin:-8px 0 12px;
      font-size:12px;
      font-weight:600;
      color:#dc2626;
    }
    .error.show{display:block}

    .btn-generate{
      width:100%;
      height:50px;
      border:0;
      border-radius:12px;
      cursor:pointer;
      font:800 15px/1 "Segoe UI",Tahoma,Arial,sans-serif;
      color:#fff;
      background:linear-gradient(135deg,#2563eb,#1d4ed8);
      box-shadow:0 10px 22px rgba(29,78,216,.32);
      transition:transform .15s,box-shadow .15s,filter .15s;
    }
    .btn-generate:hover{filter:brightness(1.06);box-shadow:0 12px 26px rgba(29,78,216,.38)}
    .btn-generate:active{transform:translateY(1px)}
    .btn-generate:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
    .btn-generate:disabled{opacity:.65;cursor:progress;transform:none}

    /* ===== صندوق النتيجة ===== */
    .result{
      display:none;
      margin-top:20px;
      padding:16px 14px 14px;
      border:2px dashed var(--green-border);
      border-radius:14px;
      background:var(--green-bg);
      text-align:center;
      animation:pop .22s ease-out;
    }
    .result.show{display:block}

    @keyframes pop{
      from{opacity:0;transform:translateY(6px) scale(.985)}
      to{opacity:1;transform:none}
    }

    .result h2{
      margin:0 0 10px;
      font-size:12.5px;
      font-weight:700;
      color:var(--green-deep);
      letter-spacing:.2px;
    }

    .code{
      direction:ltr;
      word-break:break-all;
      padding:12px 8px;
      border-radius:10px;
      background:#ffffff;
      border:1px solid #bbf7d0;
      color:#14532d;
      font:800 24px/1.35 "Consolas","Courier New",monospace;
      letter-spacing:1.6px;
      user-select:all;
    }

    .btn-copy{
      width:100%;
      height:44px;
      margin-top:12px;
      border:0;
      border-radius:10px;
      cursor:pointer;
      font:800 13.5px/1 "Segoe UI",Tahoma,Arial,sans-serif;
      color:#fff;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      box-shadow:0 8px 18px rgba(22,163,74,.28);
      transition:transform .15s,filter .15s;
    }
    .btn-copy:hover{filter:brightness(1.06)}
    .btn-copy:active{transform:translateY(1px)}
    .btn-copy:focus-visible{outline:3px solid #86efac;outline-offset:2px}

    .foot{
      margin:20px 0 0;
      padding-top:14px;
      border-top:1px solid #eef2f7;
      text-align:center;
      font-size:10.5px;
      line-height:1.8;
      color:#94a3b8;
    }

    @media (max-width:480px){
      body{padding:18px 12px}
      .card{padding:26px 20px 22px;border-radius:16px}
      .brand h1{font-size:19px}
      .code{font-size:21px;letter-spacing:1.2px}
    }

    @media (prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <div class="brand">
      <h1 id="title">مولّد التفعيل - CASH YOU</h1>
      <p>أداة خاصة بالدعم الفني لتفعيل نسخ العملاء</p>
    </div>

    <form id="activationForm" novalidate>
      <div class="field">
        <label for="machineId">أدخل كود جهاز العميل (Machine ID):</label>
        <input
          id="machineId"
          type="text"
          name="machineId"
          placeholder="CASH-XXXX-XXXX"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          dir="ltr"
          aria-describedby="formError"
        >
      </div>
      <p id="formError" class="error" role="alert">يرجى إدخال كود جهاز العميل أولاً.</p>

      <button id="generateBtn" class="btn-generate" type="submit">توليد كود التفعيل</button>
    </form>

    <section id="resultBox" class="result" aria-live="polite">
      <h2>كود التفعيل الخاص بالجهاز</h2>
      <div id="activationCode" class="code">—</div>
      <button id="copyBtn" class="btn-copy" type="button">نسخ الكود</button>
    </section>

    <p class="foot">CASH YOU · أداة محلية تعمل دون إنترنت — لا تُرسل بيانات إلى أي خادم</p>
  </main>

<script>
(() => {
  "use strict";

  /* ⚠️ مفتاح التوقيع السري — يُفضّل تغييره إلى نص سري خاص بك.
     يجب أن يكون المفتاح نفسه مضبوطًا داخل نسخة التطبيق للتحقق من الكود. */
  const SECRET_KEY = "CASH_YOU_SECRET_KEY_2026_PRO";

  const $ = (id) => document.getElementById(id);
  const form = $("activationForm");
  const machineIdInput = $("machineId");
  const generateBtn = $("generateBtn");
  const resultBox = $("resultBox");
  const codeEl = $("activationCode");
  const copyBtn = $("copyBtn");
  const errorEl = $("formError");

  const encoder = new TextEncoder();

  /** تحويل مصفوفة بايتات إلى صيغة Hexadecimal بأحرف كبيرة */
  const toHex = (buffer) =>
    Array.from(new Uint8Array(buffer), (b) => b.toString(16).padStart(2, "0"))
      .join("")
      .toUpperCase();

  /** تطبيع كود الجهاز: إزالة المسافات + تحويل لأحرف كبيرة */
  const normalize = (value) => value.replace(/\s+/g, "").toUpperCase();

  /** توليد توقيع HMAC-SHA256 وإرجاع أول 12 حرفًا بصيغة XXXX-XXXX-XXXX */
  async function generateActivationCode(machineId) {
    if (!window.crypto || !window.crypto.subtle) {
      throw new Error("هذا المتصفح لا يدعم Web Crypto API. استخدم Chrome أو Edge حديثًا.");
    }

    const key = await crypto.subtle.importKey(
      "raw",
      encoder.encode(SECRET_KEY),
      { name: "HMAC", hash: "SHA-256" },
      false,
      ["sign"]
    );

    const signature = await crypto.subtle.sign(
      "HMAC",
      key,
      encoder.encode(machineId)
    );

    const hex = toHex(signature).slice(0, 12);
    return hex.replace(/(.{4})(.{4})(.{4})/, "$1-$2-$3");
  }

  const showError = (message) => {
    errorEl.textContent = message;
    errorEl.classList.add("show");
    machineIdInput.focus();
  };

  const hideError = () => errorEl.classList.remove("show");

  machineIdInput.addEventListener("input", () => {
    hideError();
    /* إخفاء نتيجة قديمة حتى لا يُنسخ كود جهاز سابق بالخطأ */
    resultBox.classList.remove("show");
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    hideError();

    const machineId = normalize(machineIdInput.value);

    if (!machineId) {
      showError("يرجى إدخال كود جهاز العميل أولاً.");
      return;
    }
    if (machineId.length < 4) {
      showError("كود الجهاز قصير جدًا، تأكد من نسخه كاملًا.");
      return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = "جارٍ التوليد...";

    try {
      const code = await generateActivationCode(machineId);
      codeEl.textContent = code;
      resultBox.classList.remove("show");
      void resultBox.offsetWidth; /* لإعادة تشغيل حركة الظهور */
      resultBox.classList.add("show");
      copyBtn.focus({ preventScroll: true });
    } catch (error) {
      showError(error instanceof Error ? error.message : "تعذر توليد الكود، حاول مرة أخرى.");
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = "توليد كود التفعيل";
    }
  });

  copyBtn.addEventListener("click", async () => {
    const code = codeEl.textContent.trim();
    if (!code || code === "—") return;

    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(code);
      } else {
        /* بديل للعمل عند فتح الملف مباشرة من القرص (file://) */
        const helper = document.createElement("textarea");
        helper.value = code;
        helper.setAttribute("readonly", "");
        helper.style.cssText = "position:fixed;top:-9999px;opacity:0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        document.body.removeChild(helper);
      }
      alert("تم نسخ كود التفعيل بنجاح: " + code);
    } catch (error) {
      alert("تعذر النسخ تلقائيًا. الرجاء تحديد الكود ونسخه يدويًا.");
    }
  });
})();
</script>
</body>
</html>
